name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build -> typecheck -> test -> packaging, in dependency order via Turbo.
      # The token build runs the WCAG contrast gate as part of `build`, so a
      # palette change that breaks a contrast requirement fails here rather
      # than shipping.
      - run: pnpm turbo run build typecheck test lint:packaging
