name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm OIDC trusted publishing and for the provenance
      # attestation that produces the "Built and signed on GitHub Actions"
      # badge on the package page.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build typecheck test lint:packaging

      # Opens (or updates) a "Version Packages" PR when changesets are pending.
      # Merging that PR runs this workflow again with no changesets left, at
      # which point `publish` fires and pushes to npm.
      #
      # Note there is deliberately no NODE_AUTH_TOKEN. Publishing authenticates
      # via OIDC trusted publishing, configured on npmjs.com against this repo
      # and this workflow file. npm is retiring token-based publishing for
      # 2FA-bypass tokens in January 2027, so this is the durable path — and the
      # npm CLI prefers OIDC when it is available.
      - uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
