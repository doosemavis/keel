packages:
  - 'packages/*'
  - 'apps/*'

# One place to pin every shared dependency version across the whole monorepo.
#
# typescript is pinned to the 6.0 line on purpose. TypeScript 7 (the native Go
# port) does not yet expose a stable programmatic API, so Angular's tooling
# cannot consume it — @angular/compiler-cli and ng-packagr both declare
# `peerDependencies.typescript: ">=6.0 <6.1"`. When @keel/angular lands in
# Phase 3 it has to build against the same compiler the React package uses,
# so we hold the line here rather than discovering the conflict later.
catalog:
  typescript: 6.0.3

  # Build + repo tooling
  turbo: ^2.10.12
  '@changesets/cli': ^3.0.1
  tsdown: ^0.22.14
  publint: ^0.3.24
  '@arethetypeswrong/cli': ^0.18.5

  # Tokens
  style-dictionary: ^5.5.2

  # React
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.0
  react-aria-components: ^1.21.0

  # Test
  vitest: ^4.1.11

minimumReleaseAgeExclude:
  - '@internationalized/date@3.12.4'
  - '@internationalized/number@3.6.8'
  - react-aria-components@1.21.0
  - react-aria@3.52.0
  - react-stately@3.50.0
